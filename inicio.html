<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meses de amor</title>
    <link rel="stylesheet" href="inicio.css">
</head>
<body>

    <div class="mensaje">
        Si dios te puso en mi camino, es porque te necesito en mi vida.<br>
        ¿Para qué mirar a otros si tengo todo lo que quiero en frente mío?
    </div>

    <a href="recuerdos.html" class="camara">
        <img src="camara.png" alt="Recuerdos">
    </a>

    <a href="#" class="carta" id="boton-cartas">
    <img src="carta.png" alt="Cartas">
</a>

<div class="aviso-cartas" id="aviso-cartas">
    <div class="aviso-contenido">
        <div class="cerrar-aviso" id="cerrar-aviso">×</div>
        <h2>Cartas cerradas</h2>
        <p>
            Todavía falta un tiempo para esto...
        </p>
        <p>
            Podrías intentar volver el<br>
            <strong>22 de octubre</strong>
        </p>
        <span>💌</span>
    </div>
</div>

<script>
    const botonCartas = document.getElementById("boton-cartas");
    const avisoCartas = document.getElementById("aviso-cartas");
    const cerrarAviso = document.getElementById("cerrar-aviso");

    botonCartas.addEventListener("click", function(event) {
        event.preventDefault();
        avisoCartas.style.display = "flex";
    });

    cerrarAviso.addEventListener("click", function() {
        avisoCartas.style.display = "none";
    });

    avisoCartas.addEventListener("click", function(event) {
        if (event.target === avisoCartas) {
            avisoCartas.style.display = "none";
        }
    });
</script>

</body>
</html>
